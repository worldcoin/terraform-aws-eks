name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
filter-by-commitish: true

categories:
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
      - "patch"
  - title: "Maintenance"
    label: "chore"

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
  default: patch

template: |
  ## Changes

  $CHANGES

autolabeler:
  - label: "chore"
    branch:
      - '/chore\/.+/'
      - '/docs\/.+/'

  - label: "patch"
    branch:
      - '/fix\/.+/'
    title:
      - "/fix/i"

  - label: "enhancement"
    branch:
      - '/feat\/.+/'
    title:
      - '/^feat:/i'

  - label: "breaking"
    branch:
      - '/breaking\/.+/'
    body:
      - "/BREAKING/"
