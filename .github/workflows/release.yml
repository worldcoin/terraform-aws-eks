name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update Release Draft
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        env:
          GITHUB_TOKEN: ${{ github.token }}
