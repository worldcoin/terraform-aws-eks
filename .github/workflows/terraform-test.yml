name: Terraform Test Runner

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "~1.15.0"
          terraform_wrapper: false

      - name: Configure GitHub module access
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: terraform test
        run: |
          terraform -chdir="." init -input=false -backend=false
          terraform -chdir="." test -no-color

      - name: Verify identity access creation order
        run: |
          # Mock providers cannot reproduce an AWS 404 caused by missing creation ordering.
          terraform -chdir=modules/identity init -backend=false -input=false
          graph=$(terraform -chdir=modules/identity graph)
          if ! printf '%s\n' "$graph" | grep -F '"aws_eks_access_policy_association.this" -> "aws_eks_access_entry.this";'; then
            echo "::error::The identity policy association must depend on its access entry."
            exit 1
          fi
